<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEAR Digital Meter Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Playfair+Display:wght@400;700&family=Pacifico&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --track-color: #484848; }

  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Montserrat', sans-serif; }

  #board { width: 1080px; height: 1920px; position: absolute; top: 0; left: 0; transform-origin: top left; }

  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

  /* ── SESSION CONTENT ── */
  #content {
    position: absolute; z-index: 2;
    left: 59.4px; top: 362.9px; width: 961px; height: 1282px;
    display: flex; flex-direction: column;
    padding: 60px 60px 48px 60px; overflow: hidden;
  }

  #status-badge {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 24px; border-radius: 4px; font-size: 20px;
    font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 48px; align-self: flex-start;
    transition: all 0.5s ease; flex-shrink: 0;
  }
  #status-badge.live     { background: var(--track-color); color: #ffffff; }
  #status-badge.upcoming { background: transparent; color: var(--track-color); border: 2px solid var(--track-color); }
  #status-badge .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  #status-badge.live .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);} }

  #session-block { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; min-height: 0; }

  /* TIME — added font-weight: 600 */
  #session-time { font-size: 36px; font-weight: 600; color: #000; letter-spacing: 0.06em; margin-bottom: 24px; flex-shrink: 0; }

  .divider-thick { width: 100px; height: 3px; background: var(--track-color); margin-bottom: 36px; flex-shrink: 0; }

  /* TITLE — switched to Montserrat */
  #session-title { font-family: 'Montserrat', sans-serif; font-size: 72px; font-weight: 700; color: #000; line-height: 1.1; letter-spacing: -0.01em; margin-bottom: 52px; flex-shrink: 0; }

  #presenters-block { margin-bottom: 40px; flex-shrink: 0; }
  #presenters-label { font-size: 16px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 7px; color: white; background-color: var(--track-color); border-radius: 4px; margin-bottom: 12px; display: inline-block; }
  #presenters-list { font-size: 32px; font-weight: 400; color: #000; line-height: 1.4; }

  #sponsor-block { margin-bottom: 40px; flex-shrink: 0; }
  #sponsor-label { font-size: 16px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 7px; color: white; background-color: var(--track-color); border-radius: 4px; margin-bottom: 12px; display: inline-block; }
  #sponsor-name { font-size: 36px; font-weight: 400; color: #000; line-height: 1.4; }
  #sponsor-logo-img { max-height: 100px; max-width: 320px; object-fit: contain; display: block; margin-bottom: 12px; }

  #bottom-bar { margin-top: auto; padding-top: 32px; display: flex; align-items: center; flex-shrink: 0; }
  /* CLOCK — added font-weight: 600 */
  #clock { font-size: 28px; font-weight: 600; color: #000; letter-spacing: 0.1em; }

  /* ── SPECIALTY CONTENT ── */
  #specialty-content {
    position: absolute; z-index: 2;
    left: 59.4px; top: 362.9px; width: 961px; height: 1282px;
    display: flex; flex-direction: column;
    padding: 60px 60px 48px 60px; overflow: hidden;
  }

  .spec-eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--track-color); margin-bottom: 28px; flex-shrink: 0; }
  .spec-headline { font-family: 'Montserrat', sans-serif; font-size: 80px; font-weight: 700; color: #000; line-height: 1.05; letter-spacing: -0.01em; margin-bottom: 36px; flex-shrink: 0; }
  .spec-headline.pacifico { font-family: 'Pacifico', cursive; font-size: 90px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--track-color); }
  .spec-divider { width: 100px; height: 3px; background: var(--track-color); margin-bottom: 40px; flex-shrink: 0; }
  .spec-time { font-size: 36px; font-weight: 600; color: #000; letter-spacing: 0.06em; margin-bottom: 24px; flex-shrink: 0; }
  .spec-label { font-size: 16px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 7px; color: white; background-color: var(--track-color); border-radius: 4px; margin-bottom: 12px; display: inline-block; }
  .spec-body { font-size: 36px; font-weight: 400; color: #000; line-height: 1.4; margin-bottom: 28px; flex-shrink: 0; }
  .spec-body-sm { font-size: 28px; font-weight: 300; color: #000; line-height: 1.4; margin-bottom: 20px; flex-shrink: 0; }
  .spec-body-bold { font-size: 36px; font-weight: 700; color: #000; line-height: 1.4; margin-bottom: 12px; flex-shrink: 0; }
  .spec-accent { font-size: 42px; font-weight: 700; color: var(--track-color); margin-bottom: 20px; flex-shrink: 0; }
  .spec-logo { max-height: 110px; max-width: 360px; object-fit: contain; display: block; margin-bottom: 20px; flex-shrink: 0; }
  .spec-redirect-arrow { font-size: 120px; line-height: 1; color: var(--track-color); margin: 16px 0 32px; flex-shrink: 0; }
  .spec-redirect-room { font-size: 64px; font-weight: 700; color: #000; line-height: 1.1; }
  .spec-bottom { margin-top: auto; padding-top: 32px; flex-shrink: 0; }
  .spec-clock { font-size: 28px; font-weight: 600; color: #000; letter-spacing: 0.1em; }

  /* Social event card */
  .social-event-card { margin-bottom: 36px; flex-shrink: 0; }
  .social-event-name { font-size: 44px; font-weight: 700; color: #000; line-height: 1.1; margin-bottom: 12px; }
  .social-event-detail { font-size: 30px; font-weight: 400; color: #000; line-height: 1.4; margin-bottom: 6px; }
  .social-event-detail span { font-weight: 600; color: var(--track-color); }

  /* P+P sponsor pinned position */
  #pp-sponsor-block {
    position: absolute;
    left: 59.4px;
    width: 961px;
    padding: 0 60px;
    /* bottom of block = 1055px from top of board */
    /* content zone starts at 362.9px, so relative to content zone: 1055 - 362.9 = 692.1px from top of zone */
    top: 692.1px;
    z-index: 3;
  }

  /* AEC27 travel safe watermark */
  #travel-safe-watermark {
    position: absolute;
    z-index: 1;
    font-family: 'Pacifico', cursive;
    font-size: 180px;
    color: var(--track-color);
    opacity: 0.12;
    transform: rotate(-37deg);
    transform-origin: center center;
    white-space: nowrap;
    top: 50%;
    left: 50%;
    translate: -50% -50%;
    pointer-events: none;
  }

  /* Fade */
  #fade { position: absolute; inset: 0; background: #f5f0ea; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
  #fade.active { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="board">
  <img id="bg" src="" alt="">
  <div id="travel-safe-watermark" class="hidden">Travel Safe!</div>
  <div id="fade"></div>

  <!-- SESSION layout -->
  <div id="content" class="hidden">
    <div id="status-badge" class="live">
      <div class="dot"></div>
      <span id="status-text">Now In Session</span>
    </div>
    <div id="session-block">
      <div id="session-time"></div>
      <div class="divider-thick"></div>
      <div id="session-title"></div>
      <div id="presenters-block">
        <div id="presenters-label">Presenters</div>
        <div id="presenters-list"></div>
      </div>
      <div id="sponsor-block">
        <div id="sponsor-label">Sponsored by</div>
        <img id="sponsor-logo-img" src="" alt="" class="hidden">
        <div id="sponsor-name"></div>
      </div>
    </div>
    <div id="bottom-bar">
      <div id="clock"></div>
    </div>
  </div>

  <!-- P+P sponsor pinned block (rendered outside content flow) -->
  <div id="pp-sponsor-block" class="hidden">
    <div class="spec-label">Sponsored by</div>
    <div id="pp-sponsor-name" style="font-size:32px;font-weight:400;color:#000;line-height:1.4;"></div>
  </div>

  <!-- SPECIALTY layout -->
  <div id="specialty-content" class="hidden"></div>

</div>

<script>
  function scaleBoard() {
    const scale = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    document.getElementById('board').style.transform = 'scale('+scale+')';
  }
  scaleBoard();
  window.addEventListener('resize', scaleBoard);

  const SCHEDULE_URL     = 'https://novi-pheedloop-worker.avance.workers.dev/signage-schedule';
  const REFRESH_INTERVAL = 60 * 1000;
  const CLOCK_INTERVAL   = 1000;

  // Types that use the standard session layout
  const SESSION_TYPES = new Set(['RAG','CDE','ETP','T+E','Plenary','P+P']);

  function getRoomId() { return new URLSearchParams(window.location.search).get('room')||''; }

  function todayString() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function parseTime(timeStr, dateStr) {
    const tp=timeStr.split(':').map(Number), dp=dateStr.split('-').map(Number);
    const d=new Date(dp[0],dp[1]-1,dp[2]); d.setHours(tp[0],tp[1],0,0); return d;
  }
  function formatTime12(str) {
    if (!str) return '';
    const p=str.split(':').map(Number), ampm=p[0]>=12?'PM':'AM', h=p[0]%12||12;
    return h+':'+String(p[1]).padStart(2,'0')+' '+ampm;
  }
  function formatClock(date) {
    let h=date.getHours(),m=date.getMinutes(); const ampm=h>=12?'PM':'AM'; h=h%12||12;
    return h+':'+String(m).padStart(2,'0')+' '+ampm;
  }
  function el(id){return document.getElementById(id);}
  function setVisible(id,show){const e=el(id);if(e)e.classList.toggle('hidden',!show);}

  let currentSessionKey = null;

  function render(schedule, roomId, now) {
    const roomData = schedule.rooms.find(r=>r.id===roomId);
    if (!roomData) { return; }

    const today    = todayString();
    const sessions = [...roomData.sessions]
      .filter(s=>s.date===today)
      .sort((a,b)=>a.start.localeCompare(b.start));

    let displaySession=null, isLive=false;

    for (let i=0;i<sessions.length;i++) {
      const start=parseTime(sessions[i].start,today), end=parseTime(sessions[i].end,today);
      if (now>=start&&now<end) { displaySession=sessions[i]; isLive=true; break; }
    }
    if (!displaySession) {
      for (let i=0;i<sessions.length;i++) {
        if (parseTime(sessions[i].start,today)>now) { displaySession=sessions[i]; break; }
      }
    }
    if (!displaySession) {
      displaySession={title:'No further sessions today',type:'RAG',date:today,start:'',end:'',sponsor:'',sponsorLogo:'',presenters:[]};
    }

    const typeMap  = schedule.types||schedule.tracks||{};
    const typeData = typeMap[displaySession.type]
      || typeMap[(displaySession.type||'').toUpperCase()]
      || typeMap[(displaySession.type||'').toLowerCase()]
      || Object.values(typeMap)[0]
      || {color:'#484848',background:'',showPresenters:true,showSponsor:false};

    const sessionKey = displaySession.title+'|'+isLive+'|'+(typeData.color||'')+'|'+displaySession.type;
    if (sessionKey===currentSessionKey) return;

    const fade=el('fade');
    fade.classList.add('active');
    setTimeout(function(){
      applySession(displaySession, isLive, typeData);
      currentSessionKey=sessionKey;
      fade.classList.remove('active');
    },500);
  }

  function applySession(session, isLive, typeData) {
    document.getElementById('board').style.setProperty('--track-color', typeData.color||'#484848');
    el('bg').src = typeData.background||'';

    // Hide watermark by default
    setVisible('travel-safe-watermark', false);
    setVisible('pp-sponsor-block', false);

    const t = session.type;

    if (SESSION_TYPES.has(t)) {
      setVisible('content', true);
      setVisible('specialty-content', false);
      applySessionLayout(session, isLive, typeData, t);
    } else {
      setVisible('content', false);
      setVisible('specialty-content', true);
      applySpecialtyLayout(session, typeData, t);
    }
  }

  function applySessionLayout(session, isLive, typeData, t) {
    // Hide badge entirely for Break; show for all others
    const hideBadge = (t==='Break');
    setVisible('status-badge', !hideBadge);

    if (!hideBadge) {
      el('status-badge').className = isLive?'live':'upcoming';
      el('status-text').textContent = isLive?'Now In Session':'Coming Up Next';
    }

    const timeStr = (session.start&&session.end)
      ? formatTime12(session.start)+' \u2013 '+formatTime12(session.end) : '';
    el('session-time').textContent = timeStr;
    el('session-title').textContent = session.title||'';

    const hasPresenters = typeData.showPresenters && session.presenters && session.presenters.length>0;
    setVisible('presenters-block', hasPresenters);
    if (hasPresenters) {
      el('presenters-label').textContent = session.presenters.length>1?'Presenters':'Presenter';
      el('presenters-list').textContent  = session.presenters.join('\n');
      el('presenters-list').style.whiteSpace='pre-line';
    }

    // P+P: use pinned sponsor block instead of standard sponsor block
    if (t==='P+P') {
      setVisible('sponsor-block', false);
      if (session.sponsor) {
        setVisible('pp-sponsor-block', true);
        el('pp-sponsor-name').textContent = session.sponsor;
      }
    } else {
      const hasSponsor = typeData.showSponsor && !!session.sponsor;
      setVisible('sponsor-block', hasSponsor);
      if (hasSponsor) {
        el('sponsor-name').textContent = session.sponsor||'';
        const hasLogo = !!session.sponsorLogo;
        setVisible('sponsor-logo-img', hasLogo);
        if (hasLogo) el('sponsor-logo-img').src = session.sponsorLogo;
      }
    }
  }

  function applySpecialtyLayout(session, typeData, t) {
    const c = el('specialty-content');
    c.innerHTML = '';
    const timeStr = (session.start&&session.end)
      ? formatTime12(session.start)+' \u2013 '+formatTime12(session.end)
      : (session.start ? formatTime12(session.start) : '');

    function tag(cls, text) { return (text!==undefined&&text!==null&&text!=='') ? `<div class="${cls}">${text}</div>` : ''; }
    function label(text) { return `<div class="spec-label">${text}</div>`; }
    function logo(src) { return src ? `<img class="spec-logo" src="${src}" alt="">` : ''; }
    function divider() { return '<div class="spec-divider"></div>'; }
    function clock() { return `<div class="spec-bottom"><div class="spec-clock" id="spec-clock"></div></div>`; }

    if (t==='Food') {
      // "Join us for the [meal name] in the [location] from [start] to [end]"
      const meal     = session.mealType || session.title || 'meal';
      const location = session.location || '';
      const hasSponsor = !!session.sponsor || !!session.sponsorLogo;
      const sentenceParts = ['Join us for the', `<strong>${meal}</strong>`];
      if (location) sentenceParts.push('in the', `<strong>${location}</strong>`);
      if (session.start && session.end) sentenceParts.push('from', `<strong>${formatTime12(session.start)}</strong>`, 'to', `<strong>${formatTime12(session.end)}</strong>`);
      const sentence = sentenceParts.join(' ') + '.';

      c.innerHTML = `
        ${tag('spec-eyebrow', session.mealType||'Meal Break')}
        <div class="spec-divider"></div>
        <div class="spec-body" style="font-size:42px;line-height:1.5;">${sentence}</div>
        ${hasSponsor ? `<div style="margin-top:auto;padding-bottom:20px;">${logo(session.sponsorLogo)}${label('Sponsored by')}${tag('spec-body',session.sponsor)}</div>` : ''}
        ${clock()}`;
    }
    else if (t==='Break') {
      // No badge, just time and title
      c.innerHTML = `
        ${tag('spec-time', timeStr)}
        ${divider()}
        ${tag('spec-headline', session.title||'Break')}
        ${clock()}`;
    }
    else if (t==='Social') {
      const e1name = session.event1Name||'';
      const e1time = session.event1Time||'';
      const e1loc  = session.event1Location||'';
      const e2name = session.event2Name||'';
      const e2time = session.event2Time||'';
      const e2loc  = session.event2Location||'';
      c.innerHTML = `
        ${tag('spec-eyebrow', "Tonight's Social Events")}
        ${divider()}
        ${e1name ? `
          <div class="social-event-card">
            ${tag('social-event-name', e1name)}
            ${e1time ? `<div class="social-event-detail"><span>Meet at:</span> ${e1time}</div>` : ''}
            ${e1loc  ? `<div class="social-event-detail"><span>Starting at:</span> ${e1loc}</div>` : ''}
          </div>` : ''}
        ${e2name ? `
          <div class="social-event-card">
            ${tag('social-event-name', e2name)}
            ${e2time ? `<div class="social-event-detail"><span>Meet at:</span> ${e2time}</div>` : ''}
            ${e2loc  ? `<div class="social-event-detail"><span>Starting at:</span> ${e2loc}</div>` : ''}
          </div>` : ''}
        ${tag('spec-body-sm','<em>Ticketed event — see your registration confirmation for details.</em>')}
        ${clock()}`;
    }
    else if (t==='AEC27') {
      // Show watermark
      setVisible('travel-safe-watermark', true);
      const confName = session.nextEventName||'CLEAR 2027 Annual Educational Conference';
      const confLoc  = session.nextEventLocation||'';
      const confDates= session.nextEventDates||'';
      c.innerHTML = `
        ${tag('spec-eyebrow','Thank you for joining us')}
        <div class="spec-headline" style="font-size:68px;line-height:1.05;">We hope to<br>see you next year.</div>
        ${divider()}
        ${tag('spec-body-bold', confName)}
        ${confLoc   ? tag('spec-body-sm','<strong>Location:</strong> '+confLoc)   : ''}
        ${confDates ? tag('spec-body-sm','<strong>Dates:</strong> '+confDates)     : ''}
        ${session.sponsorLogo ? `<div style="margin-top:auto;padding-bottom:20px;">${logo(session.sponsorLogo)}</div>` : ''}
        ${clock()}`;
    }
    else if (t==='PlenaryRedirect') {
      c.innerHTML = `
        ${tag('spec-eyebrow','Plenary Session')}
        ${tag('spec-headline','All Sessions<br>Convening Now')}
        ${divider()}
        <div class="spec-redirect-arrow">&#8595;</div>
        ${label('Join us in')}
        ${tag('spec-redirect-room', session.redirectRoom||'Plenary Room')}
        ${session.title ? tag('spec-body-sm', session.title) : ''}
        ${clock()}`;
    }
    else if (t==='WelcomeReception') {
      c.innerHTML = `
        ${tag('spec-eyebrow','Welcome')}
        ${tag('spec-headline', session.title||'Welcome Reception')}
        ${divider()}
        ${tag('spec-time', timeStr)}
        ${session.location ? tag('spec-body','<strong>Location:</strong> '+session.location) : ''}
        ${session.sponsor||session.sponsorLogo ? `<div style="margin-top:auto;padding-bottom:20px;">${logo(session.sponsorLogo)}${label('Sponsored by')}${tag('spec-body',session.sponsor)}</div>` : ''}
        ${clock()}`;
    }
    else if (t==='CommitteeMeeting') {
      const chairs=(session.presenters||[]).join('\n');
      c.innerHTML = `
        ${tag('spec-eyebrow','Committee Meeting')}
        ${tag('spec-headline', session.title||'Committee Meeting')}
        ${divider()}
        ${tag('spec-time', timeStr)}
        ${session.location ? tag('spec-body','<strong>Location:</strong> '+session.location) : ''}
        ${chairs ? `${label((session.presenters||[]).length>1?'Chairs':'Chair')}<div class="spec-body" style="white-space:pre-line;">${chairs}</div>` : ''}
        ${clock()}`;
    }
    else if (t==='EndOfDay') {
      c.innerHTML = `
        ${tag('spec-eyebrow','End of Day')}
        <div class="spec-headline" style="font-size:68px;">Thank you for<br>joining us today.</div>
        ${divider()}
        ${session.socialEvent ? `
          ${label('Tonight')}
          ${tag('spec-body', session.socialEvent)}
          ${session.location ? tag('spec-body-sm','<strong>Meet at:</strong> '+session.location) : ''}
          ${session.ticketNote ? tag('spec-body-sm','<span style="color:var(--track-color);font-weight:600;">'+session.ticketNote+'</span>') : ''}
        ` : ''}
        ${session.seeYouTime ? `<div style="margin-top:auto;padding-bottom:20px;">${label('Tomorrow')}${tag('spec-accent','See you at '+session.seeYouTime)}</div>` : ''}
        ${clock()}`;
    }
    else {
      c.innerHTML = `
        ${tag('spec-eyebrow', t||'')}
        ${tag('spec-headline', session.title||'')}
        ${divider()}
        ${tag('spec-time', timeStr)}
        ${clock()}`;
    }

    const clk=document.getElementById('spec-clock');
    if (clk) clk.textContent = formatClock(new Date());
  }

  function tickClock() {
    const now=new Date();
    const sessClk=el('clock'); if(sessClk) sessClk.textContent=formatClock(now);
    const specClk=document.getElementById('spec-clock'); if(specClk) specClk.textContent=formatClock(now);
  }

  let scheduleCache=null;
  async function loadAndRender() {
    try { const resp=await fetch(SCHEDULE_URL+'?_='+Date.now()); scheduleCache=await resp.json(); }
    catch(e) { console.warn('Schedule load failed',e); }
    if (scheduleCache) render(scheduleCache, getRoomId(), new Date());
  }

  loadAndRender();
  tickClock();
  setInterval(loadAndRender, REFRESH_INTERVAL);
  setInterval(tickClock, CLOCK_INTERVAL);
  setInterval(function(){ if(scheduleCache) render(scheduleCache,getRoomId(),new Date()); }, CLOCK_INTERVAL);
</script>
</body>
</html>
