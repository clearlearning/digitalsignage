<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEAR Digital Meter Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Pacifico&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --track-color: #484848; }

  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Montserrat', sans-serif; }

  #board { width: 1080px; height: 1920px; position: absolute; top: 0; left: 0; transform-origin: top left; }

  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

  /* ── SESSION LAYOUT (tracks + plenary) ── */
  #session-content {
    position: absolute; z-index: 2;
    left: 59.4px; top: 362.9px; width: 961px; height: 1282px;
    display: flex; flex-direction: column;
    padding: 60px 60px 48px 60px; overflow: hidden;
  }

  #status-badge {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 24px; border-radius: 4px;
    font-size: 18px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 48px; align-self: flex-start;
    transition: all 0.5s ease; flex-shrink: 0;
  }
  #status-badge.live     { background: var(--track-color); color: #fff; }
  #status-badge.upcoming { background: transparent; color: var(--track-color); border: 2px solid var(--track-color); }
  #status-badge .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  #status-badge.live .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);} }

  #session-block { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; min-height: 0; }

  #session-time { font-size: 32px; font-weight: 300; color: #000; letter-spacing: 0.04em; margin-bottom: 24px; flex-shrink: 0; }

  .divider-thick { width: 100px; height: 3px; background: var(--track-color); margin-bottom: 36px; flex-shrink: 0; }

  #session-title { font-size: 68px; font-weight: 800; color: #000; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 52px; flex-shrink: 0; }

  #presenters-block { margin-bottom: 40px; flex-shrink: 0; }
  #presenters-label { font-size: 14px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 10px; color: white; background-color: var(--track-color); border-radius: 4px; margin-bottom: 14px; display: inline-block; }
  #presenters-list { font-size: 30px; font-weight: 400; color: #000; line-height: 1.4; }

  #sponsor-block { margin-bottom: 40px; flex-shrink: 0; }
  #sponsor-label { font-size: 14px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 10px; color: white; background-color: var(--track-color); border-radius: 4px; margin-bottom: 14px; display: inline-block; }
  #sponsor-logo { max-height: 80px; max-width: 300px; object-fit: contain; display: block; margin-bottom: 10px; }
  #sponsor-name-sess { font-size: 30px; font-weight: 500; color: #000; }

  #session-bottom { margin-top: auto; padding-top: 32px; flex-shrink: 0; }
  #session-clock { font-size: 26px; font-weight: 300; color: #000; letter-spacing: 0.08em; }

  /* ── SPECIALTY LAYOUT (generic.svg background) ── */
  #specialty-content {
    position: absolute; z-index: 2; inset: 0;
    display: flex; flex-direction: column;
    padding: 120px 80px 80px 80px;
    overflow: hidden;
  }

  /* Shared specialty elements */
  .spec-eyebrow {
    font-size: 16px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--track-color); margin-bottom: 32px; flex-shrink: 0;
  }
  .spec-headline {
    font-size: 80px; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase;
    color: #fff; line-height: 0.95; margin-bottom: 40px; flex-shrink: 0;
  }
  .spec-headline.pacifico { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 96px; text-transform: none; letter-spacing: 0; }
  .spec-divider { width: 80px; height: 4px; background: var(--track-color); margin-bottom: 48px; flex-shrink: 0; }
  .spec-title { font-size: 60px; font-weight: 700; color: #fff; line-height: 1.1; margin-bottom: 32px; flex-shrink: 0; }
  .spec-subtitle { font-size: 36px; font-weight: 300; color: rgba(255,255,255,0.75); line-height: 1.3; margin-bottom: 20px; flex-shrink: 0; }
  .spec-body { font-size: 30px; font-weight: 400; color: rgba(255,255,255,0.9); line-height: 1.5; flex-shrink: 0; margin-bottom: 20px; }
  .spec-label {
    font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 3px 10px; color: #fff; background: var(--track-color);
    border-radius: 4px; margin-bottom: 12px; display: inline-block;
  }
  .spec-accent { font-size: 40px; font-weight: 600; color: var(--track-color); margin-bottom: 16px; flex-shrink: 0; }
  .spec-logo { max-height: 120px; max-width: 400px; object-fit: contain; margin-bottom: 32px; flex-shrink: 0; }
  .spec-bottom { margin-top: auto; flex-shrink: 0; }
  .spec-clock { font-size: 26px; font-weight: 300; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; }

  /* Plenary redirect arrow */
  .redirect-arrow {
    font-size: 140px; line-height: 1; color: var(--track-color);
    margin: 20px 0 40px; flex-shrink: 0;
  }
  .redirect-room { font-size: 52px; font-weight: 800; color: #fff; letter-spacing: 0.05em; text-transform: uppercase; }

  /* Fade */
  #fade { position: absolute; inset: 0; background: #f5f0ea; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
  #fade.active { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="board">
  <img id="bg" src="" alt="">
  <div id="fade"></div>

  <!-- SESSION layout -->
  <div id="session-content" class="hidden">
    <div id="status-badge" class="live">
      <div class="dot"></div>
      <span id="status-text">Now In Session</span>
    </div>
    <div id="session-block">
      <div id="session-time"></div>
      <div class="divider-thick"></div>
      <div id="session-title"></div>
      <div id="presenters-block">
        <div id="presenters-label">Presenters</div>
        <div id="presenters-list"></div>
      </div>
      <div id="sponsor-block">
        <div id="sponsor-label">Sponsored by</div>
        <img id="sponsor-logo" src="" alt="" class="hidden">
        <div id="sponsor-name-sess"></div>
      </div>
    </div>
    <div id="session-bottom">
      <div id="session-clock"></div>
    </div>
  </div>

  <!-- SPECIALTY layout -->
  <div id="specialty-content" class="hidden">
    <!-- populated dynamically -->
  </div>

</div>

<script>
  function scaleBoard() {
    const scale = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    document.getElementById('board').style.transform = 'scale('+scale+')';
  }
  scaleBoard();
  window.addEventListener('resize', scaleBoard);

  const SCHEDULE_URL     = 'https://novi-pheedloop-worker.avance.workers.dev/signage-schedule';
  const REFRESH_INTERVAL = 60 * 1000;
  const CLOCK_INTERVAL   = 1000;

  // Types that use the session layout
  const SESSION_TYPES = new Set(['RAG','CDE','ETP','T+E','Plenary']);

  function getRoomId() { return new URLSearchParams(window.location.search).get('room')||''; }

  function todayString() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function parseTime(timeStr, dateStr) {
    const tp=timeStr.split(':').map(Number), dp=dateStr.split('-').map(Number);
    const d=new Date(dp[0],dp[1]-1,dp[2]); d.setHours(tp[0],tp[1],0,0); return d;
  }
  function formatTime12(str) {
    const p=str.split(':').map(Number), ampm=p[0]>=12?'PM':'AM', h=p[0]%12||12;
    return h+':'+String(p[1]).padStart(2,'0')+' '+ampm;
  }
  function formatClock(date) {
    let h=date.getHours(),m=date.getMinutes(); const ampm=h>=12?'PM':'AM'; h=h%12||12;
    return h+':'+String(m).padStart(2,'0')+' '+ampm;
  }
  function el(id){return document.getElementById(id);}
  function setVisible(id,show){el(id).classList.toggle('hidden',!show);}

  let currentSessionKey = null;

  function render(schedule, roomId, now) {
    const roomData = schedule.rooms.find(r=>r.id===roomId);
    if (!roomData) { renderNoSession(); return; }

    const today    = todayString();
    const sessions = [...roomData.sessions]
      .filter(s=>s.date===today)
      .sort((a,b)=>a.start.localeCompare(b.start));

    let displaySession=null, isLive=false;

    for (const s of sessions) {
      const start=parseTime(s.start,today), end=parseTime(s.end,today);
      if (now>=start && now<end) { displaySession=s; isLive=true; break; }
    }
    if (!displaySession) {
      for (const s of sessions) {
        if (parseTime(s.start,today)>now) { displaySession=s; break; }
      }
    }
    if (!displaySession) {
      displaySession={title:'No further sessions today',type:'Generic',date:today,start:'',end:'',sponsor:'',sponsorLogo:'',presenters:[]};
    }

    const typeMap  = schedule.types||schedule.tracks||{};
    const typeData = typeMap[displaySession.type]
      || typeMap[(displaySession.type||'').toUpperCase()]
      || typeMap[(displaySession.type||'').toLowerCase()]
      || Object.values(typeMap)[0]
      || {color:'#484848',background:'generic.svg'};

    const sessionKey = displaySession.title+'|'+isLive+'|'+(typeData.color||'');
    if (sessionKey===currentSessionKey) return;

    const fade=el('fade');
    fade.classList.add('active');
    setTimeout(()=>{
      applySession(schedule, displaySession, isLive, typeData);
      currentSessionKey=sessionKey;
      fade.classList.remove('active');
    },500);
  }

  function applySession(schedule, session, isLive, typeData) {
    const board=document.getElementById('board');
    board.style.setProperty('--track-color', typeData.color||'#484848');
    el('bg').src = typeData.background||'';

    const isSessionType = SESSION_TYPES.has(session.type);

    if (isSessionType) {
      setVisible('session-content', true);
      setVisible('specialty-content', false);
      applySessionLayout(session, isLive, typeData);
    } else {
      setVisible('session-content', false);
      setVisible('specialty-content', true);
      applySpecialtyLayout(schedule, session, typeData);
    }
  }

  function applySessionLayout(session, isLive, typeData) {
    el('status-badge').className = isLive?'live':'upcoming';
    el('status-text').textContent = isLive?'Now In Session':'Coming Up Next';

    el('session-time').textContent = (session.start&&session.end)
      ? formatTime12(session.start)+' \u2013 '+formatTime12(session.end) : '';

    el('session-title').textContent = session.title||'';

    const hasPresenters = typeData.showPresenters && session.presenters && session.presenters.length>0;
    setVisible('presenters-block', hasPresenters);
    if (hasPresenters) {
      el('presenters-label').textContent = session.presenters.length>1?'Presenters':'Presenter';
      el('presenters-list').textContent  = session.presenters.join('\n');
      el('presenters-list').style.whiteSpace='pre-line';
    }

    const hasSponsor = typeData.showSponsor && !!session.sponsor;
    setVisible('sponsor-block', hasSponsor);
    if (hasSponsor) {
      el('sponsor-name-sess').textContent = session.sponsor;
      const hasLogo = !!session.sponsorLogo;
      el('sponsor-logo').src = session.sponsorLogo||'';
      setVisible('sponsor-logo', hasLogo);
    }
  }

  function applySpecialtyLayout(schedule, session, typeData) {
    const container = el('specialty-content');
    container.innerHTML = '';

    const t = session.type;

    if (t==='PlenaryRedirect') {
      container.innerHTML = `
        <div class="spec-eyebrow">Plenary Session</div>
        <div class="spec-headline">All Sessions<br>Convening Now</div>
        <div class="spec-divider"></div>
        <div class="redirect-arrow">&#8595;</div>
        <div class="spec-label">Join us in</div>
        <div class="redirect-room">${session.redirectRoom||'Plenary Room'}</div>
        ${session.title ? `<div class="spec-subtitle" style="margin-top:32px;">${session.title}</div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='WelcomeReception') {
      container.innerHTML = `
        <div class="spec-eyebrow">Welcome</div>
        <div class="spec-headline">${session.title||'Welcome Reception'}</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        ${session.location ? `<div class="spec-body"><span style="font-weight:600;">Location:</span> ${session.location}</div>` : ''}
        ${session.sponsor ? `<div style="margin-top:32px;">${session.sponsorLogo?`<img class="spec-logo" src="${session.sponsorLogo}" alt="">`:''}<div class="spec-label">Sponsored by</div><div class="spec-subtitle">${session.sponsor}</div></div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='CommitteeMeeting') {
      const chairs = (session.presenters||[]).join('\n');
      container.innerHTML = `
        <div class="spec-eyebrow">Committee Meeting</div>
        <div class="spec-headline">${session.title||'Committee Meeting'}</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        ${session.location ? `<div class="spec-body"><span style="font-weight:600;">Location:</span> ${session.location}</div>` : ''}
        ${chairs ? `<div style="margin-top:40px;"><div class="spec-label">${session.presenters.length>1?'Chairs':'Chair'}</div><div class="spec-body" style="white-space:pre-line;">${chairs}</div></div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='EndOfDay') {
      container.innerHTML = `
        <div class="spec-eyebrow">End of Day</div>
        <div class="spec-headline" style="font-size:72px;">Thank you for<br>joining us today.</div>
        <div class="spec-divider"></div>
        ${session.socialEvent ? `
          <div style="margin-bottom:32px;">
            <div class="spec-label">Tonight</div>
            <div class="spec-title" style="font-size:48px;">${session.socialEvent}</div>
            ${session.location ? `<div class="spec-body"><span style="font-weight:600;">Meet at:</span> ${session.location}</div>` : ''}
            ${session.ticketNote ? `<div class="spec-body" style="color:var(--track-color);font-weight:600;">${session.ticketNote}</div>` : ''}
          </div>` : ''}
        ${session.seeYouTime ? `
          <div style="margin-top:auto;padding-bottom:20px;">
            <div class="spec-label">Tomorrow</div>
            <div class="spec-accent">See you at ${session.seeYouTime}</div>
          </div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='TravelSafe') {
      container.innerHTML = `
        <div class="spec-headline pacifico" style="color:var(--track-color);">Travel Safe!</div>
        <div class="spec-divider"></div>
        <div class="spec-subtitle" style="margin-bottom:48px;">Thank you for an incredible conference.</div>
        ${session.nextEventName ? `<div class="spec-label">Next Event</div><div class="spec-title" style="font-size:52px;margin-bottom:16px;">${session.nextEventName}</div>` : ''}
        ${session.nextEventLocation ? `<div class="spec-body"><span style="font-weight:600;">Location:</span> ${session.nextEventLocation}</div>` : ''}
        ${session.nextEventDates ? `<div class="spec-body"><span style="font-weight:600;">Dates:</span> ${session.nextEventDates}</div>` : ''}
        ${session.sponsorLogo ? `<div style="margin-top:48px;"><img class="spec-logo" src="${session.sponsorLogo}" alt=""></div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='P+P') {
      container.innerHTML = `
        <div class="spec-eyebrow">Community Break</div>
        <div class="spec-headline pacifico" style="color:var(--track-color);">Puppies<br>&amp; Posters</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        ${session.location ? `<div class="spec-body"><span style="font-weight:600;">Find us in:</span> ${session.location}</div>` : ''}
        ${session.sponsor||session.sponsorLogo ? `
          <div style="margin-top:auto;padding-bottom:20px;">
            ${session.sponsorLogo?`<img class="spec-logo" src="${session.sponsorLogo}" alt="">`:'' }
            ${session.sponsor?`<div class="spec-label">Sponsored by</div><div class="spec-subtitle">${session.sponsor}</div>`:''}
          </div>` : '<div style="margin-top:auto;"></div>'}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='Food') {
      container.innerHTML = `
        <div class="spec-eyebrow">${session.mealType||'Meal Break'}</div>
        <div class="spec-headline">${session.title||'Lunch'}</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        ${session.location ? `<div class="spec-body">Join us in <span style="font-weight:700;">${session.location}</span></div>` : ''}
        ${session.sponsor||session.sponsorLogo ? `
          <div style="margin-top:auto;padding-bottom:20px;">
            ${session.sponsorLogo?`<img class="spec-logo" src="${session.sponsorLogo}" alt="">`:'' }
            ${session.sponsor?`<div class="spec-label">Sponsored by</div><div class="spec-subtitle">${session.sponsor}</div>`:''}
          </div>` : '<div style="margin-top:auto;"></div>'}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else if (t==='Break') {
      container.innerHTML = `
        <div class="spec-eyebrow">Break</div>
        <div class="spec-headline">Take a<br>Break</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        ${session.location ? `<div class="spec-body">${session.location}</div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }
    else {
      // Generic fallback
      container.innerHTML = `
        <div class="spec-eyebrow">${session.type||''}</div>
        <div class="spec-headline">${session.title||''}</div>
        <div class="spec-divider"></div>
        ${session.start ? `<div class="spec-accent">${formatTime12(session.start)}${session.end?' \u2013 '+formatTime12(session.end):''}</div>` : ''}
        <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
      `;
    }

    // Set clock immediately after rendering
    const clk = document.getElementById('specialty-clock');
    if (clk) clk.textContent = formatClock(new Date());
  }

  function renderNoSession() {
    setVisible('session-content', false);
    setVisible('specialty-content', true);
    el('specialty-content').innerHTML = `
      <div class="spec-eyebrow">No Sessions</div>
      <div class="spec-headline">No further<br>sessions today.</div>
      <div class="spec-bottom"><div class="spec-clock" id="specialty-clock"></div></div>
    `;
  }

  function tickClock() {
    const now = new Date();
    const sessClk = el('session-clock');
    if (sessClk) sessClk.textContent = formatClock(now);
    const specClk = document.getElementById('specialty-clock');
    if (specClk) specClk.textContent = formatClock(now);
  }

  let scheduleCache=null;

  async function loadAndRender() {
    try {
      const resp = await fetch(SCHEDULE_URL+'?_='+Date.now());
      scheduleCache = await resp.json();
    } catch(e) { console.warn('Schedule load failed',e); }
    if (scheduleCache) render(scheduleCache, getRoomId(), new Date());
  }

  loadAndRender();
  tickClock();
  setInterval(loadAndRender, REFRESH_INTERVAL);
  setInterval(tickClock, CLOCK_INTERVAL);
  setInterval(()=>{ if(scheduleCache) render(scheduleCache,getRoomId(),new Date()); }, CLOCK_INTERVAL);
</script>
</body>
</html>
