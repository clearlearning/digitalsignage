<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PheedLoop Country Normalizer</title>
<style>
  :root {
    --burgundy: #64092C;
    --gold: #DDA838;
    --charcoal: #484848;
    --blue: #084D78;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f4f4f4;
    color: var(--charcoal);
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: 'Trebuchet MS', sans-serif;
    color: var(--burgundy);
    font-size: 22px;
    margin-bottom: 4px;
  }
  .sub { color: #777; font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .panel h2 {
    font-size: 15px;
    color: var(--blue);
    margin: 0 0 12px 0;
    font-family: 'Trebuchet MS', sans-serif;
  }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--charcoal); }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  button {
    background: var(--burgundy);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-right: 8px;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: var(--blue); }
  button.go { background: var(--gold); color: #333; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #status { font-size: 13px; color: #555; margin-top: 8px; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
  th { background: #faf7f2; color: var(--burgundy); font-family: 'Trebuchet MS', sans-serif; }
  tr.flagged { background: #fff8e6; }
  tr.nochange td { color: #aaa; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .badge.change { background: #e6f0f7; color: var(--blue); }
  .badge.flag { background: #fdeecb; color: #8a5a00; }
  .badge.ok { background: #eee; color: #999; }
  .badge.done { background: #e2f6e2; color: #1e7a1e; }
  .badge.err { background: #fbe2e2; color: #a11; }
  input.newval {
    width: 160px;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .summary { font-size: 13px; margin-bottom: 10px; }
  .summary b { color: var(--burgundy); }
  .toolbar { margin: 10px 0; }
  .empty { color: #999; font-size: 13px; padding: 20px 0; text-align: center; }
  a.tag { font-size: 11px; color: var(--blue); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PheedLoop Country Normalizer</h1>
  <div class="sub">Pulls attendees for an event, maps <code>address_country</code> to a full country name, and pushes only the changes you approve.</div>

  <div class="panel">
    <h2>Connection</h2>
    <div class="row">
      <div>
        <label>Worker URL</label>
        <input type="text" id="workerUrl" placeholder="https://novi-pheedloop-worker.avance.workers.dev">
      </div>
      <div>
        <label>Admin Secret (X-Admin-Secret)</label>
        <input type="password" id="adminSecret" placeholder="admin secret">
      </div>
      <div>
        <label>PheedLoop Event Code</label>
        <input type="text" id="eventCode" placeholder="EVENMCCYMPDXS">
      </div>
    </div>
    <button id="loadBtn" onclick="loadAttendees()">Load Attendees</button>
    <span id="status"></span>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <h2>Review Changes</h2>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <button class="secondary" onclick="selectAll(true)">Select All Changes</button>
      <button class="secondary" onclick="selectAll(false)">Select None</button>
      <button class="go" id="applyBtn" onclick="applyChanges()">Apply Selected Updates</button>
    </div>
    <table id="attendeeTable">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Email</th>
          <th>Current Country</th>
          <th>→ New Value</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="attendeeBody"></tbody>
    </table>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Country lookup table: ISO alpha-2, alpha-3, and common variant strings
// (all normalized to UPPERCASE for matching) -> canonical full name.
// ---------------------------------------------------------------------------
const ISO_COUNTRIES = [
  ["AF","AFG","Afghanistan"],["AL","ALB","Albania"],["DZ","DZA","Algeria"],
  ["AD","AND","Andorra"],["AO","AGO","Angola"],["AG","ATG","Antigua and Barbuda"],
  ["AR","ARG","Argentina"],["AM","ARM","Armenia"],["AU","AUS","Australia"],
  ["AT","AUT","Austria"],["AZ","AZE","Azerbaijan"],["BS","BHS","Bahamas"],
  ["BH","BHR","Bahrain"],["BD","BGD","Bangladesh"],["BB","BRB","Barbados"],
  ["BY","BLR","Belarus"],["BE","BEL","Belgium"],["BZ","BLZ","Belize"],
  ["BJ","BEN","Benin"],["BT","BTN","Bhutan"],["BO","BOL","Bolivia"],
  ["BA","BIH","Bosnia and Herzegovina"],["BW","BWA","Botswana"],["BR","BRA","Brazil"],
  ["BN","BRN","Brunei"],["BG","BGR","Bulgaria"],["BF","BFA","Burkina Faso"],
  ["BI","BDI","Burundi"],["CV","CPV","Cabo Verde"],["KH","KHM","Cambodia"],
  ["CM","CMR","Cameroon"],["CA","CAN","Canada"],["CF","CAF","Central African Republic"],
  ["TD","TCD","Chad"],["CL","CHL","Chile"],["CN","CHN","China"],
  ["CO","COL","Colombia"],["KM","COM","Comoros"],["CG","COG","Congo"],
  ["CD","COD","Congo (DRC)"],["CR","CRI","Costa Rica"],["CI","CIV","Cote d'Ivoire"],
  ["HR","HRV","Croatia"],["CU","CUB","Cuba"],["CY","CYP","Cyprus"],
  ["CZ","CZE","Czech Republic"],["DK","DNK","Denmark"],["DJ","DJI","Djibouti"],
  ["DM","DMA","Dominica"],["DO","DOM","Dominican Republic"],["EC","ECU","Ecuador"],
  ["EG","EGY","Egypt"],["SV","SLV","El Salvador"],["GQ","GNQ","Equatorial Guinea"],
  ["ER","ERI","Eritrea"],["EE","EST","Estonia"],["SZ","SWZ","Eswatini"],
  ["ET","ETH","Ethiopia"],["FJ","FJI","Fiji"],["FI","FIN","Finland"],
  ["FR","FRA","France"],["GA","GAB","Gabon"],["GM","GMB","Gambia"],
  ["GE","GEO","Georgia"],["DE","DEU","Germany"],["GH","GHA","Ghana"],
  ["GR","GRC","Greece"],["GD","GRD","Grenada"],["GT","GTM","Guatemala"],
  ["GN","GIN","Guinea"],["GW","GNB","Guinea-Bissau"],["GY","GUY","Guyana"],
  ["HT","HTI","Haiti"],["HN","HND","Honduras"],["HK","HKG","Hong Kong"],
  ["HU","HUN","Hungary"],["IS","ISL","Iceland"],["IN","IND","India"],
  ["ID","IDN","Indonesia"],["IR","IRN","Iran"],["IQ","IRQ","Iraq"],
  ["IE","IRL","Ireland"],["IL","ISR","Israel"],["IT","ITA","Italy"],
  ["JM","JAM","Jamaica"],["JP","JPN","Japan"],["JO","JOR","Jordan"],
  ["KZ","KAZ","Kazakhstan"],["KE","KEN","Kenya"],["KI","KIR","Kiribati"],
  ["KW","KWT","Kuwait"],["KG","KGZ","Kyrgyzstan"],["LA","LAO","Laos"],
  ["LV","LVA","Latvia"],["LB","LBN","Lebanon"],["LS","LSO","Lesotho"],
  ["LR","LBR","Liberia"],["LY","LBY","Libya"],["LI","LIE","Liechtenstein"],
  ["LT","LTU","Lithuania"],["LU","LUX","Luxembourg"],["MO","MAC","Macao"],
  ["MG","MDG","Madagascar"],["MW","MWI","Malawi"],["MY","MYS","Malaysia"],
  ["MV","MDV","Maldives"],["ML","MLI","Mali"],["MT","MLT","Malta"],
  ["MH","MHL","Marshall Islands"],["MR","MRT","Mauritania"],["MU","MUS","Mauritius"],
  ["MX","MEX","Mexico"],["FM","FSM","Micronesia"],["MD","MDA","Moldova"],
  ["MC","MCO","Monaco"],["MN","MNG","Mongolia"],["ME","MNE","Montenegro"],
  ["MA","MAR","Morocco"],["MZ","MOZ","Mozambique"],["MM","MMR","Myanmar"],
  ["NA","NAM","Namibia"],["NR","NRU","Nauru"],["NP","NPL","Nepal"],
  ["NL","NLD","Netherlands"],["NZ","NZL","New Zealand"],["NI","NIC","Nicaragua"],
  ["NE","NER","Niger"],["NG","NGA","Nigeria"],["KP","PRK","North Korea"],
  ["MK","MKD","North Macedonia"],["NO","NOR","Norway"],["OM","OMN","Oman"],
  ["PK","PAK","Pakistan"],["PW","PLW","Palau"],["PS","PSE","Palestine"],
  ["PA","PAN","Panama"],["PG","PNG","Papua New Guinea"],["PY","PRY","Paraguay"],
  ["PE","PER","Peru"],["PH","PHL","Philippines"],["PL","POL","Poland"],
  ["PT","PRT","Portugal"],["PR","PRI","Puerto Rico"],["QA","QAT","Qatar"],
  ["RO","ROU","Romania"],["RU","RUS","Russia"],["RW","RWA","Rwanda"],
  ["KN","KNA","Saint Kitts and Nevis"],["LC","LCA","Saint Lucia"],
  ["VC","VCT","Saint Vincent and the Grenadines"],["WS","WSM","Samoa"],
  ["SM","SMR","San Marino"],["ST","STP","Sao Tome and Principe"],
  ["SA","SAU","Saudi Arabia"],["SN","SEN","Senegal"],["RS","SRB","Serbia"],
  ["SC","SYC","Seychelles"],["SL","SLE","Sierra Leone"],["SG","SGP","Singapore"],
  ["SK","SVK","Slovakia"],["SI","SVN","Slovenia"],["SB","SLB","Solomon Islands"],
  ["SO","SOM","Somalia"],["ZA","ZAF","South Africa"],["KR","KOR","South Korea"],
  ["SS","SSD","South Sudan"],["ES","ESP","Spain"],["LK","LKA","Sri Lanka"],
  ["SD","SDN","Sudan"],["SR","SUR","Suriname"],["SE","SWE","Sweden"],
  ["CH","CHE","Switzerland"],["SY","SYR","Syria"],["TW","TWN","Taiwan"],
  ["TJ","TJK","Tajikistan"],["TZ","TZA","Tanzania"],["TH","THA","Thailand"],
  ["TL","TLS","Timor-Leste"],["TG","TGO","Togo"],["TO","TON","Tonga"],
  ["TT","TTO","Trinidad and Tobago"],["TN","TUN","Tunisia"],["TR","TUR","Turkey"],
  ["TM","TKM","Turkmenistan"],["TV","TUV","Tuvalu"],["UG","UGA","Uganda"],
  ["UA","UKR","Ukraine"],["AE","ARE","United Arab Emirates"],
  ["GB","GBR","United Kingdom"],["US","USA","United States"],
  ["UY","URY","Uruguay"],["UZ","UZB","Uzbekistan"],["VU","VUT","Vanuatu"],
  ["VA","VAT","Vatican City"],["VE","VEN","Venezuela"],["VN","VNM","Vietnam"],
  ["YE","YEM","Yemen"],["ZM","ZMB","Zambia"],["ZW","ZWE","Zimbabwe"]
];

// Extra common misspellings / abbreviations / variants, mapped to the
// canonical name (all keys must be UPPERCASE for matching).
const EXTRA_VARIANTS = {
  "USA": "United States",
  "U.S.": "United States",
  "U.S.A.": "United States",
  "US": "United States",
  "UNITED STATES OF AMERICA": "United States",
  "AMERICA": "United States",
  "UNITEDSTATES": "United States",
  "UNITED STATE": "United States",
  "CANADA": "Canada",
  "CAN": "Canada",
  "IRELAND": "Ireland",
  "IRL": "Ireland",
  "REPUBLIC OF IRELAND": "Ireland",
  "NEW ZEALAND": "New Zealand",
  "NZ": "New Zealand",
  "NZL": "New Zealand",
  "SAUDI ARABIA": "Saudi Arabia",
  "SAU": "Saudi Arabia",
  "KSA": "Saudi Arabia",
  "UK": "United Kingdom",
  "U.K.": "United Kingdom",
  "GREAT BRITAIN": "United Kingdom",
  "ENGLAND": "United Kingdom",
  "SCOTLAND": "United Kingdom",
  "WALES": "United Kingdom",
  "NORTHERN IRELAND": "United Kingdom",
  "UAE": "United Arab Emirates",
  "SOUTH KOREA": "South Korea",
  "KOREA, SOUTH": "South Korea",
  "REPUBLIC OF KOREA": "South Korea",
  "NORTH KOREA": "North Korea",
  "MEXICO": "Mexico",
  "MEXICO CITY": "Mexico",
};

const COUNTRY_LOOKUP = {};
ISO_COUNTRIES.forEach(([a2, a3, name]) => {
  COUNTRY_LOOKUP[a2] = name;
  COUNTRY_LOOKUP[a3] = name;
  COUNTRY_LOOKUP[name.toUpperCase()] = name;
});
Object.keys(EXTRA_VARIANTS).forEach(k => {
  COUNTRY_LOOKUP[k] = EXTRA_VARIANTS[k];
});

function normalizeCountry(raw) {
  if (!raw) return { mapped: null, matched: false };
  const key = raw.trim().toUpperCase().replace(/\.+$/, "");
  if (COUNTRY_LOOKUP[key]) {
    return { mapped: COUNTRY_LOOKUP[key], matched: true };
  }
  // try stripping periods entirely (e.g. "U.S.A" -> "USA")
  const stripped = key.replace(/\./g, "");
  if (COUNTRY_LOOKUP[stripped]) {
    return { mapped: COUNTRY_LOOKUP[stripped], matched: true };
  }
  return { mapped: null, matched: false };
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let attendees = []; // { code, name, email, current, mapped, matched, changed }

function loadSaved() {
  document.getElementById('workerUrl').value = localStorage.getItem('pheedloop_worker_url') || '';
  document.getElementById('adminSecret').value = localStorage.getItem('pheedloop_admin_secret') || '';
  document.getElementById('eventCode').value = localStorage.getItem('pheedloop_event_code') || '';
}
loadSaved();

function saveSettings() {
  localStorage.setItem('pheedloop_worker_url', document.getElementById('workerUrl').value.trim());
  localStorage.setItem('pheedloop_admin_secret', document.getElementById('adminSecret').value.trim());
  localStorage.setItem('pheedloop_event_code', document.getElementById('eventCode').value.trim());
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

async function loadAttendees() {
  saveSettings();
  const workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');
  const eventCode = document.getElementById('eventCode').value.trim();
  if (!workerUrl || !eventCode) {
    setStatus('Enter Worker URL and Event Code.');
    return;
  }

  document.getElementById('loadBtn').disabled = true;
  setStatus('Loading attendees...');
  attendees = [];

  let page = 1;
  const pageSize = 100;
  try {
    while (true) {
      const res = await fetch(`${workerUrl}/pheedloop-attendee?event=${encodeURIComponent(eventCode)}&page=${page}&page_size=${pageSize}`);
      if (!res.ok) {
        throw new Error(`Attendee fetch failed: ${res.status}`);
      }
      const data = await res.json();
      const results = data.results || [];
      results.forEach(a => {
        const current = a.address_country || '';
        const { mapped, matched } = normalizeCountry(current);
        const changed = matched && mapped !== current;
        attendees.push({
          code: a.code,
          name: [a.first_name, a.last_name].filter(Boolean).join(' ') || '(no name)',
          email: a.email || '',
          current: current,
          suggested: matched ? mapped : '',
          matched: matched,
          changed: changed,
          include: changed,
          status: null,
        });
      });
      setStatus(`Loading attendees... ${attendees.length} so far`);
      if (!data.next) break;
      page++;
    }
  } catch (err) {
    setStatus('Error: ' + err.message);
    document.getElementById('loadBtn').disabled = false;
    return;
  }

  document.getElementById('loadBtn').disabled = false;
  setStatus(`Loaded ${attendees.length} attendees.`);
  renderTable();
}

function renderTable() {
  document.getElementById('resultsPanel').style.display = 'block';
  const body = document.getElementById('attendeeBody');
  body.innerHTML = '';

  const toChange = attendees.filter(a => a.changed).length;
  const flagged = attendees.filter(a => !a.matched && a.current).length;
  const ok = attendees.filter(a => a.matched && !a.changed).length;
  const blank = attendees.filter(a => !a.current).length;

  document.getElementById('summary').innerHTML =
    `<b>${attendees.length}</b> total attendees &nbsp;|&nbsp; ` +
    `<b>${toChange}</b> need correction &nbsp;|&nbsp; ` +
    `<b>${flagged}</b> unrecognized (need manual review) &nbsp;|&nbsp; ` +
    `<b>${ok}</b> already correct &nbsp;|&nbsp; ` +
    `<b>${blank}</b> blank`;

  // Sort: flagged first, then changes, then already-correct
  const sorted = [...attendees].sort((a, b) => {
    const score = x => (!x.matched && x.current ? 0 : (x.changed ? 1 : 2));
    return score(a) - score(b);
  });

  sorted.forEach((a, idx) => {
    const realIdx = attendees.indexOf(a);
    const tr = document.createElement('tr');
    let badge = '<span class="badge ok">no change</span>';
    if (!a.matched && a.current) {
      tr.className = 'flagged';
      badge = '<span class="badge flag">unrecognized</span>';
    } else if (a.changed) {
      badge = '<span class="badge change">will update</span>';
    } else if (!a.current) {
      tr.className = 'nochange';
      badge = '<span class="badge ok">blank</span>';
    } else {
      tr.className = 'nochange';
    }

    const checkboxDisabled = (!a.changed && a.matched) ? 'disabled' : '';
    const checked = a.include ? 'checked' : '';

    tr.innerHTML = `
      <td><input type="checkbox" ${checked} ${checkboxDisabled} onchange="toggleInclude(${realIdx}, this.checked)"></td>
      <td>${escapeHtml(a.name)}</td>
      <td>${escapeHtml(a.email)}</td>
      <td>${escapeHtml(a.current) || '<i>(blank)</i>'}</td>
      <td><input type="text" class="newval" value="${escapeHtml(a.suggested)}" onchange="editSuggestion(${realIdx}, this.value)"></td>
      <td>${a.status ? a.status : badge}</td>
    `;
    body.appendChild(tr);
  });
}

function toggleInclude(idx, checked) {
  attendees[idx].include = checked;
}

function editSuggestion(idx, val) {
  attendees[idx].suggested = val.trim();
  if (val.trim() && val.trim() !== attendees[idx].current) {
    attendees[idx].include = true;
    attendees[idx].changed = true;
  }
}

function selectAll(state) {
  attendees.forEach(a => {
    if (a.changed || (state && a.suggested)) a.include = state;
  });
  renderTable();
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function applyChanges() {
  const workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');
  const adminSecret = document.getElementById('adminSecret').value.trim();
  const eventCode = document.getElementById('eventCode').value.trim();

  if (!adminSecret) {
    setStatus('Admin Secret is required to write updates.');
    return;
  }

  const toApply = attendees.filter(a => a.include && a.suggested && a.suggested !== a.current);
  if (!toApply.length) {
    setStatus('Nothing selected to update.');
    return;
  }

  if (!confirm(`This will update address_country for ${toApply.length} attendee(s) in PheedLoop. Continue?`)) {
    return;
  }

  document.getElementById('applyBtn').disabled = true;
  let done = 0, errors = 0;

  for (const a of toApply) {
    setStatus(`Updating ${done + errors + 1} of ${toApply.length}...`);
    try {
      const res = await fetch(`${workerUrl}/admin/update-attendee`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': adminSecret,
        },
        body: JSON.stringify({
          eventCode: eventCode,
          attendeeCode: a.code,
          fields: { address_country: a.suggested }
        })
      });
      if (res.ok) {
        a.status = '<span class="badge done">updated</span>';
        a.current = a.suggested;
        a.changed = false;
        done++;
      } else {
        a.status = '<span class="badge err">failed (' + res.status + ')</span>';
        errors++;
      }
    } catch (err) {
      a.status = '<span class="badge err">error</span>';
      errors++;
    }
    // small delay to be gentle on PheedLoop's API
    await new Promise(r => setTimeout(r, 150));
  }

  document.getElementById('applyBtn').disabled = false;
  setStatus(`Done. ${done} updated, ${errors} failed.`);
  renderTable();
}
</script>
</body>
</html>
